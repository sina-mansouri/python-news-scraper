version: '3.8'

services:
  api:
    build: .
    container_name: news_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    container_name: news_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # Not published to the host by default -- only reachable from other
    # containers on the compose network (e.g. the "api" service).
    # Uncomment below only if you need to connect from outside Docker
    # (e.g. a local DB GUI client), and only on a trusted network.
    # ports:
    #   - "5432:5432"
    restart: always

  frontend:
    image: nginx:alpine
    container_name: news_frontend
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: always
