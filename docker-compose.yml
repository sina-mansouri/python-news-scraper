version: '3.8'

services:
  api:
    build: .
    container_name: news_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - POSTGRES_DB=newsdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    container_name: news_db
    environment:
      - POSTGRES_DB=newsdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    restart: always

  frontend:
    image: nginx:alpine
    container_name: news_frontend
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: always